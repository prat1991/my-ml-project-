# .github/workflows/cd.yml
name: CD-Deploy Model to SageMaker

#Event Listener- When CI completes, workflow_run event is marked completed
#Event Handler-workflow_run event completed status auto triggers CD execution
on:
  workflow_run:
    workflows: ["CI-Train&Upload Model To S3"] 
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed - skip if CI failed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # 1. Get the code
      - uses: actions/checkout@v4

      # 2. Inject AWS credentials from GitHub Secrets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Install Terraform
      - uses: hashicorp/setup-terraform@v3

      # 4. Run terraform/cd/main.tf (creates SageMaker endpoint)
      - name: Terraform Init
        working-directory: terraform/cd
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/cd
        run: terraform apply -auto-approve 
        -var="s3_bucket=my-ml-models-iris" 
        # Pass SageMaker IAM role from GitHub Secrets
        -var="sagemaker_role_arn=${{ secrets.SAGEMAKER_ROLE_ARN }}"

      # 5. Install boto3 to call the SageMaker endpoint from Python
      - name: Install dependencies
        run: pip install boto3

      # 6. Send a test prediction to the live SageMaker endpoint
      - name: Run Prediction
        run: python predict.py iris-endpoint

      # 7. Tear down the SageMaker endpoint to avoid ongoing AWS costs
      #    if: always() means this runs even if prediction step fails
      - name: Destroy endpoint
        if: always()
        working-directory: terraform/cd
        run: terraform destroy -auto-approve 
        -var="s3_bucket=my-ml-models-iris" 
        -var="sagemaker_role_arn=${{ secrets.SAGEMAKER_ROLE_ARN }}"